name: ROLL36
options:
  bundleIdPrefix: com.lequangtrongtai
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Lets Xcode extract String(localized:)/Text keys into the string catalogs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # PLAN.md 4.2: everything is @MainActor unless an actor/nonisolated type says otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Staging: debug
  Release-Staging: release
  Debug-Prod: debug
  Release-Prod: release

# One xcconfig per environment; contract in skill ios-new-app references/environments.md.
configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Staging: Config/Staging.xcconfig
  Release-Staging: Config/Staging.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

# Own libraries (versions + integration snippets): skill `iletai-libs`; new_app.sh --with adds them here.

targets:
  ROLL36:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        # Own variable: a project-level PRODUCT_BUNDLE_IDENTIFIER would also give the test bundles the app's id.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug-* keep DEBUG on top of the env condition from the xcconfig (partial match on config name).
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    info:
      path: App/Info.plist
      properties:
        # Xcode silently drops INFOPLIST_KEY_<custom> build settings, so every custom key lives here.
        UILaunchScreen: {}
        # The app is dark only on purpose (PLAN.md 3.1).
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: ROLL 36 needs the camera to expose frames onto your film roll.
        NSPhotoLibraryUsageDescription: ROLL 36 saves developed frames to your photo library and applies film stocks to photos you pick.
        NSPhotoLibraryAddUsageDescription: ROLL 36 saves developed frames to your photo library.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's built-in encryption; avoids "Missing Compliance" on every build.
        ITSAppUsesNonExemptEncryption: false
        # Store page for update prompts / share links; empty until the ASC record exists.
        APP_STORE_URL: $(APP_STORE_URL)
        # dev | staging | prod, read by AppConfiguration.environment.
        APP_ENV: $(APP_ENV)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ROLL36Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: ROLL36

  ROLL36UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: ROLL36

schemes:
  # Dev owns the test targets; every scheme archives with its Release-* config.
  ROLL36-Dev:
    build:
      targets:
        ROLL36: all
        ROLL36Tests: [test]
        ROLL36UITests: [test]
    run:
      config: Debug-Dev
      storeKitConfiguration: App/Monetization/ROLL36.storekit
    test:
      config: Debug-Dev
      gatherCoverageData: true
      coverageTargets:
        - ROLL36
      targets:
        - ROLL36Tests
        - ROLL36UITests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  ROLL36-Staging:
    build:
      targets:
        ROLL36: all
    run:
      config: Debug-Staging
    profile:
      config: Release-Staging
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  ROLL36:
    build:
      targets:
        ROLL36: all
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
